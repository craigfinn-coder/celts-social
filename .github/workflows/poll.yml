name: Poll CeltsAreHere

on:
  # WordPress pings this the moment a post is published.
  # There is deliberately NO schedule: polling the site every 15 minutes got
  # GitHub's runners blocked by the site's bot protection (403). Push, don't poll.
  # "rerun-card" comes from the "Resend social card" link in WordPress.
  repository_dispatch:
    types: [new-post, rerun-card]

  workflow_dispatch:
    inputs:
      url:
        description: "Render one article by URL (leave blank for a normal poll)"
        required: false
      headline:
        description: "Override the headline text"
        required: false
      bootstrap:
        description: "Tick this on the very first run only"
        type: boolean
        default: false
      buffer:
        description: "Send the Facebook card to Buffer? (test = scheduled 7 days ahead, delete it after checking)"
        type: choice
        options: ["off", "test", "addToQueue", "shareNow"]
        default: "off"

concurrency:
  group: cah-poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Secrets are lifted to env here because GitHub does not allow the
    # `secrets` context inside a step-level `if:`.
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      RCLONE_REMOTE: ${{ secrets.RCLONE_REMOTE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Only runs if you have chosen to also sync to Drive/Dropbox.
      - name: Set up rclone
        if: ${{ env.RCLONE_CONF != '' }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Poll and render
        env:
          CAH_VARIANTS: facebook,story
          IN_URL: ${{ inputs.url }}
          IN_HEADLINE: ${{ inputs.headline }}
          IN_BOOTSTRAP: ${{ inputs.bootstrap }}
          # Set when WordPress pinged us. If the ping carries the article URL
          # (under any of these keys) that article is looked up directly
          # instead of waiting for it to show up in the cached list.
          PINGED: ${{ github.event_name == 'repository_dispatch' }}
          RERUN: ${{ github.event.action == 'rerun-card' }}
          PING_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          PING_ID: ${{ github.event.client_payload.id || github.event.client_payload.post_id }}
          PING_URL: >-
            ${{ github.event.client_payload.url
             || github.event.client_payload.link
             || github.event.client_payload.permalink
             || github.event.client_payload.post_url
             || github.event.client_payload.post_permalink }}
        run: |
          if [ "$IN_BOOTSTRAP" = "true" ]; then
            python src/poll.py --bootstrap
          elif [ -n "$IN_URL" ] && [ -n "$IN_HEADLINE" ]; then
            python src/poll.py --url "$IN_URL" --headline "$IN_HEADLINE"
          elif [ -n "$IN_URL" ]; then
            python src/poll.py --url "$IN_URL"
          elif [ "$RERUN" = "true" ]; then
            echo "Resend requested from WordPress: $PING_PAYLOAD"
            extra=()
            [ -n "$PING_ID" ] && extra+=(--id "$PING_ID")
            python src/poll.py --url "$PING_URL" --mark-seen "${extra[@]}"
          elif [ "$PINGED" = "true" ]; then
            echo "Ping payload: $PING_PAYLOAD"
            # One retry: a wobble on the site or GitHub shouldn't cost a card.
            python src/poll.py --expect-new --payload "$PING_PAYLOAD" || {
              echo "::warning::First attempt failed - trying once more in 30s"
              sleep 30
              python src/poll.py --expect-new --payload "$PING_PAYLOAD"
            }
          else
            python src/poll.py
          fi

      - name: Publish cards to the writers' page
        run: |
          shopt -s nullglob
          made=(out/*.jpg)
          if [ ${#made[@]} -eq 0 ]; then
            echo "No new cards this run - page left as it was."
            exit 0
          fi

          repo="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"

          # Fetch the existing page, or start one if this is the first time.
          if ! git clone --depth 1 --branch gh-pages "$repo" pages 2>/dev/null; then
            echo "Creating the gh-pages branch for the first time."
            git clone --depth 1 "$repo" pages
            git -C pages checkout --orphan gh-pages
            git -C pages rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p pages/cards
          cp out/*.jpg pages/cards/ 2>/dev/null || true
          cp out/*.txt pages/cards/ 2>/dev/null || true

          python src/gallery.py pages

          # Squashed to a single commit every time, so the repository never
          # grows without limit however long this runs for.
          cd pages
          git checkout --orphan latest
          git add -A
          git -c user.name="celtsarehere-bot" \
              -c user.email="bot@users.noreply.github.com" \
              commit -q -m "Cards updated $(date -u +%FT%TZ)"
          git push -f "$repo" latest:gh-pages
          echo "Writers' page updated."

      # Buffer runs before the state is saved so what it sent is recorded
      # (state/buffered.json) and a re-run never posts the same article twice.
      # continue-on-error so a Buffer hiccup never stops the state save; the
      # last step turns the run red if Buffer failed, so it gets noticed.
      # Automatic (WordPress ping / resend) runs use the BUFFER_MODE repo
      # variable, default addToQueue. Manual runs only post if you pick one.
      - name: Send Facebook card to Buffer
        id: buffer
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_MODE: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.buffer
                || vars.BUFFER_MODE
                || 'addToQueue' }}
        run: |
          if [ "$BUFFER_MODE" = "off" ]; then
            echo "Buffer switched off for this run."
            exit 0
          fi
          python src/buffer_post.py

      - name: Remember which articles are done
        run: |
          git config user.name  "celtsarehere-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/seen.json state/buffered.json
          git diff --staged --quiet && exit 0
          git commit -q -m "state: $(date -u +%FT%TZ)"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase FETCH_HEAD; then
              git checkout --theirs state/seen.json state/buffered.json 2>/dev/null || true
              git add state/seen.json state/buffered.json
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
          done
          exit 1

      - name: Keep a 30-day backup of this run's cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ github.run_id }}
          path: out/*
          if-no-files-found: ignore
          retention-days: 30

      - name: Flag a Buffer failure
        if: ${{ steps.buffer.outcome == 'failure' }}
        run: |
          echo "::error::The card was made but did NOT reach Facebook. Open the post in WordPress (Posts list) and click 'Resend social card'."
          exit 1
